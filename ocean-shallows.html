<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocean Shallows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#06243c;
    font-family:"Nunito Sans","PingFang SC","Microsoft YaHei",sans-serif;color:#eaf7ff}
  #stage{position:fixed;inset:0}
  canvas#gl{display:block;width:100%;height:100%;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 90% 80% at 50% 45%,transparent 40%,rgba(0,18,36,.42) 100%)}
  .ui{position:fixed;z-index:5;transition:opacity .35s ease}
  body.hideui .ui{opacity:0;pointer-events:none}
  #showui{position:fixed;z-index:6;left:14px;top:14px;width:34px;height:34px;border-radius:50%;
    border:1px solid rgba(255,255,255,.28);background:rgba(6,36,58,.5);color:#eaf7ff;font-size:17px;
    cursor:pointer;display:none;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
  body.hideui #showui{display:flex}
  header{position:fixed;z-index:5;left:0;right:0;top:0;padding:18px 22px;display:flex;
    align-items:flex-start;gap:18px;pointer-events:none;transition:opacity .35s}
  body.hideui header{opacity:0}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(22px,3.1vw,40px);
    margin:0;letter-spacing:.01em;line-height:1.05;text-shadow:0 2px 18px rgba(0,20,40,.6)}
  h1 em{font-style:italic;font-weight:400;color:#b9f0e6}
  #tagline{margin:5px 0 0;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
    opacity:.72;text-shadow:0 1px 8px rgba(0,20,40,.7)}
  #hright{margin-left:auto;display:flex;align-items:center;gap:9px;pointer-events:auto}
  #counter{font-size:12px;letter-spacing:.09em;padding:8px 14px;border-radius:999px;
    background:rgba(6,36,58,.38);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);
    white-space:nowrap;text-shadow:0 1px 6px rgba(0,20,40,.5)}
  #counter b{color:#a9f2e3;font-weight:700}
  .lang{font-size:11px;font-weight:700;letter-spacing:.08em;padding:8px 13px;border-radius:999px;
    background:rgba(6,36,58,.38);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);
    color:#eaf7ff;cursor:pointer;min-width:56px}
  .lang:hover,.tbtn:hover{background:rgba(120,220,220,.24)}
  #tools{position:fixed;z-index:5;right:22px;top:76px;display:flex;flex-wrap:wrap;
    justify-content:flex-end;gap:7px;max-width:min(460px,52vw)}
  .tbtn{font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:7px 12px;border-radius:999px;
    background:rgba(6,36,58,.36);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px);
    color:#eaf7ff;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s}
  .tbtn kbd{font-family:inherit;font-size:9px;opacity:.55;margin-left:5px;border:1px solid rgba(255,255,255,.3);
    border-radius:3px;padding:0 3px}
  .tbtn.on{background:rgba(94,224,206,.28);border-color:rgba(160,255,240,.62);color:#dffff8}
  #dockwrap{position:fixed;z-index:5;left:50%;bottom:20px;transform:translateX(-50%);width:min(94vw,880px)}
  #dock{display:flex;gap:10px;justify-content:center;padding:12px;border-radius:22px;
    background:linear-gradient(160deg,rgba(180,230,235,.16),rgba(6,34,54,.48));
    border:1px solid rgba(255,255,255,.24);box-shadow:0 18px 60px rgba(0,16,34,.45),inset 0 1px 0 rgba(255,255,255,.2);
    backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%)}
  .card{position:relative;flex:1 1 0;min-width:0;max-width:168px;border-radius:15px;cursor:grab;
    background:linear-gradient(170deg,rgba(255,255,255,.14),rgba(8,40,62,.34));
    border:1px solid rgba(255,255,255,.2);padding:7px 7px 9px;user-select:none;touch-action:none;
    transition:transform .18s,border-color .18s,box-shadow .18s}
  .card:hover{transform:translateY(-6px);border-color:rgba(180,255,244,.7);
    box-shadow:0 12px 26px rgba(0,30,50,.4)}
  .card:active{cursor:grabbing}
  .thumb{width:100%;aspect-ratio:1.42;border-radius:10px;display:block;object-fit:cover;
    background:radial-gradient(circle at 50% 32%,#3ba9b4,#0a3354 78%);pointer-events:none}
  .cname{display:block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.02em;
    text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .csci{display:block;font-family:"Fraunces",serif;font-style:italic;font-size:9.5px;opacity:.62;
    text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dockhint{text-align:center;font-size:10.5px;letter-spacing:.06em;opacity:.65;margin-top:8px;
    text-shadow:0 1px 6px rgba(0,20,40,.6)}
  #dragGhost{position:fixed;z-index:9;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;
    pointer-events:none;display:none;border:1px dashed rgba(190,255,245,.85);
    background:radial-gradient(circle,rgba(120,240,225,.22),transparent 68%);
    box-shadow:0 0 30px rgba(120,240,225,.35)}
  #dragGhost span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;letter-spacing:.08em;color:#dffff8;text-align:center}
  #whirl{position:fixed;z-index:7;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;
    display:none;cursor:grab;touch-action:none;border:1px solid rgba(190,255,245,.6);
    background:radial-gradient(circle,rgba(8,40,70,.1) 30%,rgba(140,240,230,.16) 62%,transparent 72%)}
  #whirl::after{content:"";position:absolute;inset:20px;border:2px solid rgba(200,255,248,.65);
    border-right-color:transparent;border-radius:50%;animation:spin 2.4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #toast{position:fixed;z-index:8;left:50%;top:76px;transform:translate(-50%,-8px);
    padding:8px 16px;border-radius:999px;font-size:12px;letter-spacing:.04em;
    background:rgba(6,36,58,.6);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(12px);
    opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;background:#06243c;font-family:"Fraunces",serif;font-size:20px;
    transition:opacity .6s}
  #boot small{font-family:"Nunito Sans",sans-serif;font-size:12px;opacity:.6;letter-spacing:.1em}
  #boot.gone{opacity:0;pointer-events:none}
  @media (max-width:780px){
    header{padding:12px 13px;gap:10px}
    #tagline{display:none}
    #hright{gap:6px;flex-direction:column;align-items:flex-end}
    #counter{font-size:10px;padding:6px 10px}
    .lang{padding:6px 10px;min-width:46px}
    #tools{right:10px;top:66px;max-width:calc(100vw - 20px);gap:5px}
    .tbtn{font-size:10px;padding:6px 9px}
    .tbtn kbd{display:none}
    #dockwrap{left:0;bottom:8px;width:100%;transform:none;padding:0 8px}
    #dock{justify-content:flex-start;overflow-x:auto;gap:8px;padding:9px;border-radius:18px;
      scrollbar-width:none}
    #dock::-webkit-scrollbar{display:none}
    .card{flex:0 0 106px;max-width:none}
    .cname{font-size:9.5px}.csci{font-size:8px}
    #dockhint{margin-top:6px;font-size:9.5px}
    #toast{top:auto;bottom:180px;font-size:11px}
  }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>
<div id="vignette"></div>
<header>
  <div><h1>Ocean <em>Shallows</em></h1><p id="tagline" data-i18n="tagline">A living tropical shoal</p></div>
  <div id="hright">
    <div id="counter">0 rays · 0 jellies</div>
    <button class="lang" id="langBtn">EN</button>
  </div>
</header>
<div id="tools" class="ui">
  <button class="tbtn" id="bRain" data-i18n="rain">Rain<kbd>R</kbd></button>
  <button class="tbtn" id="bWhirl" data-i18n="whirl">Whirlpool<kbd>W</kbd></button>
  <button class="tbtn" id="bCalm" data-i18n="calm">Calm<kbd>C</kbd></button>
  <button class="tbtn" id="bClear" data-i18n="clear">Clear sea<kbd>X</kbd></button>
  <button class="tbtn" id="bSound" data-i18n="sound">Sound<kbd>M</kbd></button>
  <button class="tbtn" id="bHide" data-i18n="hide">Hide UI<kbd>H</kbd></button>
</div>
<div id="dockwrap" class="ui">
  <div id="dock"></div>
  <div id="dockhint" data-i18n="dockhint">Click to toss into the sea · drag to place anywhere · tap a creature to startle it</div>
</div>
<div id="dragGhost" class="ui"><span id="dragLabel">↕</span></div>
<div id="whirl" class="ui"></div>
<div id="toast"></div>
<button id="showui" title="Show UI">☰</button>
<div id="boot">Ocean Shallows<small>building the shoal…</small></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('boot').innerHTML='Three.js failed to load<small>check your network / CDN access</small>';return;}

/* ==================== constants & helpers ==================== */
const W=64.0,H=44.0,SIM=256,MAXC=48,RIB=22;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;
const I18N={
  en:{tagline:'A living tropical shoal',rain:'Rain',whirl:'Whirlpool',calm:'Calm',clear:'Clear sea',
      sound:'Sound',hide:'Hide UI',dockhint:'Click to toss · drag to hover & place · tap a creature to startle it',
      names:['Manta','Spotted Eagle Ray','Blue-spotted Stingray','Moon Jelly','Sea Nettle'],
      sci:['Mobula birostris','Aetobatus narinari','Taeniura lymma','Aurelia aurita','Chrysaora fuscescens'],
      ghost:'drop here',limit:'Sea is full (48 creatures)',cleared:'The sea is clear',
      rain_on:'Rain on — ripples everywhere',whirl_on:'Whirlpool on — drag the ring to move it',
      calm_on:'Calm sea',sound_on:'Sound on',sound_off:'Sound off',jump:'breaching!',webgl:'WebGL unavailable'},
  zh:{tagline:'一片活着的热带浅海',rain:'下雨',whirl:'漩涡',calm:'平静',clear:'清空海洋',
      sound:'声音',hide:'隐藏界面',dockhint:'点击卡片抛入海中 · 拖动卡片悬停并放到任意位置 · 轻点生物会惊走它',
      names:['蝠鲼','斑点鹞鲼','蓝斑魟','海月水母','太平洋黄金水母'],
      sci:['Mobula birostris','Aetobatus narinari','Taeniura lymma','Aurelia aurita','Chrysaora fuscescens'],
      ghost:'放在这里',limit:'海里满了（上限 48 只）',cleared:'海洋已清空',
      rain_on:'下雨中 — 满海涟漪',whirl_on:'漩涡已开启 — 拖动圆环移动位置',
      calm_on:'海面平静',sound_on:'声音已开启',sound_off:'声音已关闭',jump:'跃出水面！',webgl:'当前设备不支持 WebGL'}
};
let LANG='zh';
const T=k=>I18N[LANG][k];
const isRay=k=>k<3;
let quality=2,hidden=false;

/* ==================== shared GLSL ==================== */
const COMMON=`
const vec2 ARENA = vec2(${W.toFixed(1)}, ${H.toFixed(1)});
float hash21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  float a=hash21(i),b=hash21(i+vec2(1.0,0.0)),c=hash21(i+vec2(0.0,1.0)),d=hash21(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}
float fbm(vec2 p){float s=0.0,a=0.5;for(int i=0;i<4;i++){s+=a*vnoise(p);p*=2.03;a*=0.5;}return s;}
float shoreDist(vec2 p){
  vec2 q=(p-vec2(-0.02,-0.02))*vec2(1.0,1.12);
  float d=length(q)-0.355;
  d+=(fbm(p*5.2)-0.5)*0.045;
  d+=(fbm(p*14.0)-0.5)*0.019;
  d+=(fbm(p*38.0)-0.5)*0.005;
  return d;
}
float segDist(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float t=clamp(dot(pa,ba)/max(dot(ba,ba),1e-6),0.0,1.0);return length(pa-ba*t);}
float caus(vec2 p,float t){
  float a=0.0;vec2 q=p;
  for(int i=0;i<3;i++){
    float fi=float(i);
    vec2 v=q+vec2(sin(t*0.42+fi*1.9),cos(t*0.33+fi*2.4))*0.8;
    float n=vnoise(v*1.25+fi*4.3);
    a+=1.0-abs(n*2.0-1.0);
    q=q*1.73+2.7;
  }
  a/=3.0;
  return pow(clamp(a,0.0,1.0),6.0);
}
float spotty(vec2 p,float dens,float ring){
  vec2 g=floor(p*dens),f=fract(p*dens)-0.5;
  float h=hash21(g);
  vec2 off=(vec2(hash21(g+3.17),hash21(g+7.71))-0.5)*0.42;
  float r=0.13+0.17*hash21(g+1.9);
  float d=length(f-off);
  float s=ring>0.5 ? smoothstep(0.055,0.015,abs(d-r)) : smoothstep(r,r-0.055,d);
  return s*step(0.32,h);
}
vec3 waterTint(float depth){
  return mix(vec3(0.16,0.78,0.72),vec3(0.016,0.15,0.38),smoothstep(0.0,0.88,depth));
}
`;
const QUAD_VS=`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}`;

/* ==================== renderer / camera ==================== */
let renderer;
try{
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:false,alpha:false,
    powerPreference:'high-performance'});
}catch(e){
  document.getElementById('boot').innerHTML=T('webgl');return;
}
renderer.setClearColor(0x06243c,1);
const DPRMAX=Math.min(window.devicePixelRatio||1,2);
let pixelRatio=DPRMAX;
const camera=new THREE.OrthographicCamera(-30,30,22,-22,0.1,300);
camera.position.set(0,62,20);camera.lookAt(0,0,0);camera.updateMatrixWorld();
function fit(){
  const w=window.innerWidth,h=window.innerHeight,a=w/h;
  let hh=22,hw=hh*a;
  if(hw>60){hw=60;hh=hw/a;}
  camera.left=-hw;camera.right=hw;camera.top=hh;camera.bottom=-hh;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(w,h,false);
}
fit();
window.addEventListener('resize',fit);
const camRight=new THREE.Vector3(1,0,0);
let time=0;

/* ==================== GPGPU height field (absorbing boundaries) ==================== */
const rtType=(renderer.capabilities.isWebGL2||renderer.extensions.get('OES_texture_half_float'))
  ? THREE.HalfFloatType : THREE.UnsignedByteType;
function makeRT(w,h,type,filter){
  return new THREE.WebGLRenderTarget(w,h,{minFilter:filter,magFilter:filter,
    format:THREE.RGBAFormat,type:type||THREE.UnsignedByteType,depthBuffer:false,stencilBuffer:false,
    wrapS:THREE.ClampToEdgeWrapping,wrapT:THREE.ClampToEdgeWrapping});
}
let simA=makeRT(SIM,SIM,rtType,THREE.LinearFilter);
let simB=makeRT(SIM,SIM,rtType,THREE.LinearFilter);
const simScene=new THREE.Scene();
const simCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const simQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),null);
simQuad.frustumCulled=false;simScene.add(simQuad);
const ENC=`vec2 dec(vec4 c){return (c.rg-0.5)*8.0;} vec4 enc(vec2 s){return vec4(clamp(s/8.0+0.5,0.0,1.0),0.0,1.0);}`;
const SIM_INIT=new THREE.ShaderMaterial({vertexShader:QUAD_VS,
  fragmentShader:`void main(){gl_FragColor=vec4(0.5,0.5,0.0,1.0);}`,depthTest:false,depthWrite:false});
const SIM_STEP=new THREE.ShaderMaterial({
  uniforms:{uState:{value:null},uTexel:{value:new THREE.Vector2(1/SIM,1/SIM)},
    uC:{value:0.30},uDamp:{value:0.992},uCalm:{value:0}},
  vertexShader:QUAD_VS,
  fragmentShader:`
    varying vec2 vUv;uniform sampler2D uState;uniform vec2 uTexel;
    uniform float uC,uDamp,uCalm;${ENC}
    void main(){
      vec2 st=dec(texture2D(uState,vUv));
      float h=st.x,v=st.y;
      float l=dec(texture2D(uState,vUv+vec2(uTexel.x,0.0))).x
             +dec(texture2D(uState,vUv-vec2(uTexel.x,0.0))).x
             +dec(texture2D(uState,vUv+vec2(0.0,uTexel.y))).x
             +dec(texture2D(uState,vUv-vec2(0.0,uTexel.y))).x;
      v+=(l*0.25-h)*uC;
      v*=mix(uDamp,0.90,uCalm*0.75);
      h+=v;h*=0.9992;
      float b=min(min(vUv.x,1.0-vUv.x),min(vUv.y,1.0-vUv.y));
      float absb=smoothstep(0.11,0.005,b);
      v*=1.0-0.22*absb;h*=1.0-0.13*absb;
      h*=1.0-uCalm*0.02;
      gl_FragColor=enc(vec2(h,v));
    }`,depthTest:false,depthWrite:false});
const PULSE=new THREE.ShaderMaterial({
  uniforms:{uState:{value:null},uCount:{value:0},
    uPulses:{value:Array.from({length:16},()=>new THREE.Vector4(0,0,0,0))},uRing:{value:0}},
  vertexShader:QUAD_VS,
  fragmentShader:`
    varying vec2 vUv;uniform sampler2D uState;uniform int uCount;
    uniform vec4 uPulses[16];uniform float uRing;${COMMON}${ENC}
    void main(){
      vec2 st=dec(texture2D(uState,vUv));
      vec2 d=vUv*ARENA;
      for(int i=0;i<16;i++){
        if(i>=uCount)break;
        vec4 q=uPulses[i];
        vec2 e=d-q.xy*ARENA;
        float r2=dot(e,e);
        float g=exp(-r2/max(q.z*q.z,0.001));
        if(uRing>0.5){float rr=sqrt(r2);g=exp(-pow((rr-q.z*2.0)/(q.z*0.42),2.0));}
        st.y+=q.w*g;
        st.x+=q.w*g*0.24;
      }
      gl_FragColor=enc(clamp(st,vec2(-3.9),vec2(3.9)));
    }`,depthTest:false,depthWrite:false});
function runPass(mat,target){
  simQuad.material=mat;
  renderer.setRenderTarget(target);
  renderer.render(simScene,simCam);
  renderer.setRenderTarget(null);
}
runPass(SIM_INIT,simA);runPass(SIM_INIT,simB);
let pulseQueue=[];
function addPulse(u,v,radius,strength,isRing){
  if(pulseQueue.length>=64)return;
  pulseQueue.push([u,v,radius,strength,!!isRing]);
}
function flushPulses(){
  while(pulseQueue.length){
    let ring=0;
    if(pulseQueue[0][4])ring=1;
    const batch=pulseQueue.splice(0,16);
    // keep ring / dot batches separate
    const same=[],rest=[];
    for(const q of batch)(!!q[4]===!!ring?same:rest).push(q);
    pulseQueue.unshift(...rest);
    PULSE.uniforms.uRing.value=ring;
    PULSE.uniforms.uCount.value=same.length;
    const arr=PULSE.uniforms.uPulses.value;
    for(let i=0;i<same.length;i++)arr[i].set(same[i][0],same[i][1],same[i][2],same[i][3]);
    PULSE.uniforms.uState.value=simA.texture;
    runPass(PULSE,simB);
    const t=simA;simA=simB;simB=t;
    if(!rest.length)break;
  }
}
function stepSim(steps){
  /* keep the sim framebuffer bound across sub-steps instead of bouncing back to the
     default framebuffer between each pass; identical pixels, fewer state changes */
  simQuad.material=SIM_STEP;
  for(let i=0;i<steps;i++){
    SIM_STEP.uniforms.uState.value=simA.texture;
    renderer.setRenderTarget(simB);
    renderer.render(simScene,simCam);
    const t=simA;simA=simB;simB=t;
  }
  renderer.setRenderTarget(null);
}

/* ==================== baked seabed (one-off render target) ==================== */
const BAKE=1024;
const seabedRT=makeRT(BAKE,BAKE,THREE.UnsignedByteType,THREE.LinearFilter);
(function bakeSeabed(){
  const sc=new THREE.Scene();
  const cam=new THREE.OrthographicCamera(0,1,1,0,0.1,20);
  cam.position.set(0.5,0.5,8);cam.lookAt(0.5,0.5,0);cam.updateMatrixWorld();
  sc.add(new THREE.AmbientLight(0xffffff,0.82));
  const dl=new THREE.DirectionalLight(0xfff3d8,0.85);dl.position.set(-1.4,1.8,4);sc.add(dl);
  const dl2=new THREE.DirectionalLight(0x66b8c8,0.35);dl2.position.set(1.5,-1,2);sc.add(dl2);
  const sandMat=new THREE.ShaderMaterial({vertexShader:QUAD_VS,
    fragmentShader:`
      varying vec2 vUv;${COMMON}

function baseRayGeometry(){
  const NU=26,NV=12,pos=[],nor=[],aU=[],aV=[],aSide=[],aFin=[],idx=[];
  function push(x,y,z,u,v,s,f){pos.push(x,y,z);nor.push(0,s,0);aU.push(u);aV.push(v);aSide.push(s);aFin.push(f);}

    const au=Math.abs(u);
    return [0.16+0.62*Math.pow(1-au,0.72),-0.30-0.16*(1-au*au)];
  }
  for(let side=0;side<2;side++){
    const s=side===0?1:-1,base=pos.length/3;
    for(let j=0;j<=NV;j++){
      const v=j/NV;
      for(let i=0;i<=NU;i++){
        const u=-1+2*i/NU,au=Math.abs(u),o=outline(u);
        const z=lerp(o[1],o[0],v);
        const th=0.055*(1-au*au*0.82)*(0.35+0.65*Math.sin(v*Math.PI)*0.9+0.3);
        push(u*1.02,s*th-0.055*au*au,z,u,v*2-1,s,0);
      }
    }
    for(let j=0;j<NV;j++)for(let i=0;i<NU;i++){
      const a=base+j*(NU+1)+i,b=a+1,c=a+NU+1,d=c+1;
      if(s>0)idx.push(a,c,b,b,c,d);else idx.push(a,b,c,b,d,c);
    }
  }
  for(let k=0;k<2;k++){
    const sg=k===0?-1:1,b0=pos.length/3;
    push(sg*0.20,0.01,0.60,sg*0.2,0.8,1,1);push(sg*0.46,0.02,0.86,sg*0.5,1.0,1,1);
    push(sg*0.44,0.01,0.66,sg*0.5,0.75,1,1);push(sg*0.22,0.01,0.38,sg*0.2,0.6,1,1);
    idx.push(b0,b0+1,b0+2,b0,b0+2,b0+3);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('aU',new THREE.Float32BufferAttribute(aU,1));
  g.setAttribute('aV',new THREE.Float32BufferAttribute(aV,1));
  g.setAttribute('aSide',new THREE.Float32BufferAttribute(aSide,1));
  g.setAttribute('aFin',new THREE.Float32BufferAttribute(aFin,1));
  g.setIndex(idx);return g;
}

  varying vec2 vWP;varying vec3 vN;
  void main(){

const points=new THREE.Points(pGeo,pMat);points.renderOrder=20;points.frustumCulled=false;mainScene.add(points);
let pDirty=true;
function emit(x,y,z,vx,vy,vz,life,size,type){
  const i=pCursor;pCursor=(pCursor+1)%PN;
  pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;
  pVel[i*3]=vx;pVel[i*3+1]=vy;pVel[i*3+2]=vz;
  pLife[i]=1;pMax[i]=life;pSize[i]=size;pType[i]=type;
  pDirty=true;
}
function burst(x,z,power,type){
  const n=Math.round(clamp(power*22,10,quality<1?20:38));
  for(let i=0;i<n;i++){
    const a=rnd(0,TAU),sp=rnd(0.7,3.4)*power;
    emit(x,rnd(0.02,0.3),z,Math.cos(a)*sp,rnd(1.6,5.2)*power,Math.sin(a)*sp,
      rnd(0.5,1.1),rnd(1.6,4.0),type||0);
  }
}
function updateParticles(dt){
  let active=false;
  for(let i=0;i<PN;i++){
    if(pLife[i]<=0)continue;
    active=true;
    pLife[i]-=dt/pMax[i];
    if(pLife[i]<=0){pLife[i]=0;pPos[i*3+1]=-999;continue;}
    pVel[i*3+1]-=11.0*dt;
    pPos[i*3]+=pVel[i*3]*dt;pPos[i*3+1]+=pVel[i*3+1]*dt;pPos[i*3+2]+=pVel[i*3+2]*dt;
    if(pPos[i*3+1]<0&&pType[i]===1){pLife[i]=0;pPos[i*3+1]=-999;}
    else if(pPos[i*3+1]<0&&pVel[i*3+1]<0)pVel[i*3+1]*=-0.20;
  }
  /* skip four full buffer uploads every frame when nothing is moving */
  if(!active&&!pDirty)return;
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.aLife.needsUpdate=true;
  pGeo.attributes.aSize.needsUpdate=true;pGeo.attributes.aType.needsUpdate=true;
  pDirty=false;
}

/* ==================== audio ==================== */
const Audio_={ctx:null,gain:null,noise:null,filter:null,on:false};
function initAudio(){
  if(Audio_.ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const ctx=new AC();Audio_.ctx=ctx;
  const len=ctx.sampleRate*2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
  let last=0;
  for(let i=0;i<len;i++){last=(last+(Math.random()*2-1)*0.10)*0.995;d[i]=last*0.9;}
  const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;lp.Q.value=0.6;
  const g=ctx.createGain();g.gain.value=0.0001;
  src.connect(lp);lp.connect(g);g.connect(ctx.destination);src.start();
  Audio_.gain=g;Audio_.filter=lp;Audio_.noise=src;
}
function soundSplash(power){
  if(!Audio_.on||!Audio_.ctx)return;
  const c=Audio_.ctx,t=c.currentTime,len=Math.floor(c.sampleRate*0.35);
  const b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
  const s=c.createBufferSource();s.buffer=b;
  const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1100+Math.random()*900;f.Q.value=0.8;
  const g=c.createGain();g.gain.value=clamp(0.22*power,0.03,0.28);
  s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);s.stop(t+0.36);
}
function soundChime(){
  if(!Audio_.on||!Audio_.ctx)return;
  const c=Audio_.ctx,t=c.currentTime;
  [880,1320,1760].forEach((fq,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.value=fq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.10/(i+1),t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.55+i*0.12);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.8);
  });
}
function fract(v){return v-Math.floor(v);}
function updateAudio(){
  if(!Audio_.ctx)return;
  if(!Audio_.on){
    /* muted: the target is constant, so schedule it once instead of every frame */
    if(!Audio_.muted){Audio_.muted=true;Audio_.gain.gain.setTargetAtTime(0.0001,Audio_.ctx.currentTime,0.12);}
    return;
  }
  Audio_.muted=false;
  const ph=fract(time/8.2);
  const env=ph<0.26?Math.sin(ph/0.26*Math.PI):Math.pow(1-(ph-0.26)/0.74,1.5)*0.55;
  const g=(0.014+env*0.105)*(1-calmV*0.7);
  Audio_.gain.gain.setTargetAtTime(g,Audio_.ctx.currentTime,0.12);
  Audio_.filter.frequency.setTargetAtTime(360+env*900+rainV*300,Audio_.ctx.currentTime,0.2);
}

/* ==================== thumbnails rendered from the real 3D geometry ==================== */
function expandGeometry(instGeo,count){
  const out=new THREE.BufferGeometry(),vc=instGeo.getAttribute('position').count,total=vc*count;
  for(const k in instGeo.attributes){
    const a=instGeo.attributes[k],s=a.itemSize,arr=new Float32Array(total*s);
    if(a.isInstancedBufferAttribute){
      for(let i=0;i<count;i++)for(let v=0;v<vc;v++)for(let c=0;c<s;c++)arr[(i*vc+v)*s+c]=a.array[i*s+c];
    }else{
      for(let i=0;i<count;i++)for(let v=0;v<vc;v++)for(let c=0;c<s;c++)arr[(i*vc+v)*s+c]=a.array[v*s+c];
    }
    out.setAttribute(k,new THREE.BufferAttribute(arr,s));
  }
  const src=instGeo.getIndex(),ia=new Uint32Array(src.count*count);
  for(let i=0;i<count;i++)for(let j=0;j<src.count;j++)ia[i*src.count+j]=src.getX(j)+i*vc;
  out.setIndex(new THREE.BufferAttribute(ia,1));
  return out;
}
function setConst(g,name,val){
  const a=g.getAttribute(name),s=a.itemSize;
  for(let i=0;i<a.count;i++)for(let c=0;c<s;c++)a.array[i*s+c]=Array.isArray(val)?val[c]:val;
}
function makeThumbs(){
  const cv=document.createElement('canvas');cv.width=220;cv.height=154;
  let tr;
  try{tr=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true,preserveDrawingBuffer:true});}
  catch(e){return [null,null,null,null,null];}
  tr.setSize(220,154,false);tr.setClearColor(0x000000,0);
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(36,220/154,0.1,60);
  cam.position.set(0,3.6,5.0);cam.lookAt(0,0,0);
  const group=new THREE.Group();sc.add(group);
  CU.uTime.value=1.1;
  function snap(kind){
    while(group.children.length)group.remove(group.children[0]);
    const ray=isRay(kind);
    if(ray){
      const bG=expandGeometry(makeInstanced(G.ray,RAYN,1).geo,1);
      setConst(bG,'aOffset',[0,0,0]);
      setConst(bG,'aP0',[0.35,1.45,0.6,-0.12]);
      setConst(bG,'aP1',[0.15,kind<2?1.0:0.0,kind,0]);
      group.add(new THREE.Mesh(bG,rayMat));
      const tG=expandGeometry(makeInstanced(G.tail,TAILN,1).geo,1);
      setConst(tG,'aOffset',[0,0,0]);setConst(tG,'aHeading',0.35);setConst(tG,'aScale',1.45);
      setConst(tG,'aPhase',0.6);setConst(tG,'aKind',kind);setConst(tG,'aActive',1);setConst(tG,'aSub',0.15);
      group.add(new THREE.Mesh(tG,tailMat));
    }else{
      for(let s=0;s<MAXC;s++){jellyA[s].set(0,0,0,0);jellyB[s].set(0,0,0,0);}
      jellyA[0].set(0,0,0,1.45);jellyB[0].set(0.35,0.1,0,0.25);
      const bG=expandGeometry(makeInstanced(G.bell,BELLN,1).geo,1);
      setConst(bG,'aOffset',[0,0,0]);setConst(bG,'aScale',1.45);setConst(bG,'aPhase',0.35);
      setConst(bG,'aKind',kind-3);setConst(bG,'aActive',1);setConst(bG,'aSub',0.2);setConst(bG,'aTilt',0.18);
      group.add(new THREE.Mesh(bG,bellMat));
      const rg=makeInstanced(G.rib,RIBN,RIB);
      for(let k=0;k<RIB;k++){
        const type=k<14?0:(k<19?1:2),ang=(k/RIB)*TAU;
        setA(rg.at,'aJelly',k,[0]);setA(rg.at,'aAngle',k,[ang]);
        setA(rg.at,'aLen',k,[kind===4?(type===2?1.0:type===1?2.3:0.55):(type===2?0.7:0.62)]);
        setA(rg.at,'aType',k,[kind===3?0:type]);
        setA(rg.at,'aWidth',k,[type===2?0.075:0.014]);
      }
      flushAttrs(rg.at);
      group.add(new THREE.Mesh(expandGeometry(rg.geo,RIB),ribMat));
    }
    group.rotation.y=-0.25;group.position.y=ray?0.1:0.25;
    tr.render(sc,cam);
    return cv.toDataURL('image/png');
  }
  const arr=[];
  for(let k=0;k<5;k++){try{arr.push(snap(k));}catch(e){arr.push(null);}}
  CU.uTime.value=0;
  for(let s=0;s<MAXC;s++){jellyA[s].set(0,0,0,0);jellyB[s].set(0,0,0,0);}
  tr.dispose();
  /* dispose() frees GL resources but leaves a second live WebGL context attached to
     the discarded canvas; explicitly lose it so the driver can reclaim it */
  try{
    const ext=tr.getContext().getExtension('WEBGL_lose_context');
    if(ext)ext.loseContext();
  }catch(e){}
  return arr;
}

/* ==================== creature state & behaviour ==================== */
const creatures=[];
const slots=new Array(MAXC).fill(false);
function takeSlot(){for(let i=0;i<MAXC;i++)if(!slots[i]){slots[i]=true;return i;}return -1;}
/* reused scratch array: every caller consumes the result immediately, never stores it */
const _uv2=[0,0];
function worldToUV(x,z){_uv2[0]=clamp(x/W+0.5,0,1);_uv2[1]=clamp(z/H+0.5,0,1);return _uv2;}
function uvToWorld(u,v){return [(u-0.5)*W,(v-0.5)*H];}
function shoreAtUV(u,v){const qx=u+0.02,qy=(v+0.02)*1.12;return Math.sqrt(qx*qx+qy*qy)-0.355;}
function spawn(kind,opt){
  if(creatures.length>=MAXC){toast(T('limit'));return null;}
  opt=opt||{};
  const slot=takeSlot();if(slot<0)return null;
  let x=opt.x,z=opt.z;
  if(x===undefined){
    for(let k=0;k<60;k++){
      const u=rnd(0.30,0.94),v=rnd(0.26,0.92);
      if(shoreAtUV(u,v)>0.10){const w=uvToWorld(u,v);x=w[0];z=w[1];break;}
    }
    if(x===undefined){x=rnd(4,22);z=rnd(0,14);}
  }
  const c={kind,slot,x,z,y:opt.y!==undefined?opt.y:(isRay(kind)?-0.55:-0.85),
    heading:rnd(0,TAU),speed:isRay(kind)?rnd(0.9,1.9):rnd(0.18,0.45),
    phase:rnd(0,TAU),bank:0,flip:0,sub:0.4,tilt:rnd(-0.16,0.16),
    vx:0,vz:0,rest:false,flee:0,jump:null,throw:null,hover:false,turn:0,
    size:isRay(kind)?(kind===0?rnd(1.75,2.3):kind===1?rnd(1.55,1.95):rnd(1.2,1.55)):rnd(1.15,1.65),
    trailT:0,dripT:0,age:0};
  if(opt.throw){
    const tu=rnd(0.36,0.86),tv=rnd(0.30,0.86),tw=uvToWorld(tu,tv);
    c.throw={t:0,dur:1.15,sx:0,sz:H*0.52,sy:9,tx:tw[0],tz:tw[1]};
    c.x=0;c.z=H*0.52;c.y=9;
  }
  if(opt.hover){c.hover=true;c.y=2.6;}
  creatures.push(c);
  if(!c.throw&&!c.hover&&!opt.quiet)enterWater(c,0.6);
  updateCounter();
  return c;
}
function enterWater(c,power){
  const uv=worldToUV(c.x,c.z);
  addPulse(uv[0],uv[1],0.010,0.85*power,false);
  addPulse(uv[0],uv[1],0.016,0.42*power,true);
  burst(c.x,c.z,power,0);
  soundSplash(power);
}
function removeCreature(c){
  const i=creatures.indexOf(c);if(i>=0)creatures.splice(i,1);
  slots[c.slot]=false;
  jellyA[c.slot].set(0,0,0,0);jellyB[c.slot].set(0,0,0,0);
  updateCounter();
}
function clearSea(){while(creatures.length)removeCreature(creatures[0]);toast(T('cleared'));soundChime();}

/* ---- behaviour ---- */
function updateCreatures(dt){
  for(const c of creatures){
    c.age+=dt;
    if(c.throw){
      const q=c.throw;q.t+=dt;
      const u=clamp(q.t/q.dur,0,1);
      c.x=lerp(q.sx,q.tx,u);c.z=lerp(q.sz,q.tz,u);
      c.y=q.sy*(1-u)+3.2*4.0*u*(1-u);
      c.flip=u*TAU*1.25;c.heading=Math.atan2(q.tx-q.sx,q.tz-q.sz)+0.3;
      if(u>=1){c.throw=null;c.y=-0.45;c.flip=0;enterWater(c,1.0);}
      c.sub=0;continue;
    }
    if(c.hover){c.sub=0;c.vx*=0.9;c.vz*=0.9;continue;}
    if(c.jump){
      const q=c.jump;q.t+=dt;const u=clamp(q.t/q.dur,0,1);
      c.x=lerp(q.sx,q.ex,u);c.z=lerp(q.sz,q.ez,u);
      c.y=3.4*4.0*u*(1-u)-0.45*(1-u);
      c.flip=u*TAU;c.bank=lerp(c.bank,u*0.5,0.1);
      if(u>=1){c.jump=null;c.y=-0.5;c.flip=0;enterWater(c,0.85);toast(T('jump'));}
      c.sub=0;continue;
    }
    if(c.flee>0)c.flee-=dt;
    const ray=isRay(c.kind);
    const uv=worldToUV(c.x,c.z),shore=shoreAtUV(uv[0],uv[1]);
    if(ray){
      let turn=Math.sin(time*0.42+c.phase)*0.45+Math.sin(time*0.17+c.phase*2.1)*0.28;
      if(shore<0.045)turn+=1.5;
      if(c.x< -W*0.44||c.x>W*0.44)turn+=Math.sign(c.x)*-1.3;
      if(c.z< -H*0.44||c.z>H*0.44)turn+=Math.sign(c.z)*-1.3;
      c.turn=lerp(c.turn,turn,dt*2.0);
      c.heading+=c.turn*dt*(c.flee>0?1.6:1.0);
      c.bank=lerp(c.bank,clamp(c.turn*0.55,-0.65,0.65),dt*3.0);
      let sp=c.speed*(c.flee>0?2.5:1.0)*(1-calmV*0.35);
      if(c.rest)sp=0.02;
      const dx=Math.sin(c.heading),dz=Math.cos(c.heading);
      c.vx=dx*sp;c.vz=dz*sp;
      c.x+=c.vx*dt;c.z+=c.vz*dt;
      const targetY=c.rest?-0.26:-0.52-0.35*clamp(shore,0,1);
      c.y=lerp(c.y,targetY,dt*2.2);
      if(c.kind===2){
        if(!c.rest&&shore>0.02&&shore<0.16&&Math.random()<dt*0.10)c.rest=true;
        if(c.rest&&c.flee>0)c.rest=false;
        if(c.rest&&Math.random()<dt*0.045){c.rest=false;c.flee=0.6;}
      }else if(!c.rest&&Math.random()<dt*0.035&&shore>0.18){
        const h=c.heading;
        c.jump={t:0,dur:1.9,sx:c.x,sz:c.z,ex:c.x+Math.sin(h)*9,ez:c.z+Math.cos(h)*9};
      }
      c.trailT-=dt;
      if(c.trailT<=0&&c.y>-0.72&&!c.rest){
        c.trailT=0.20;
        const t=worldToUV(c.x-Math.sin(c.heading)*0.8,c.z-Math.cos(c.heading)*0.8);
        addPulse(t[0],t[1],0.006,0.075,false);
        if(Math.random()<0.25)emit(c.x,c.y+0.1,c.z,0,0.2,0,0.7,1.6,2);
      }
    }else{
      const ph=fract(time*0.62+c.phase);
      const thrust=ph<0.27?1.0-smooth01(ph/0.27):0.15;
      let vx=0.42*Math.sin(time*0.23+c.phase*0.2)+0.20*Math.cos(c.heading)*thrust*0.7;
      let vz=0.30*Math.cos(time*0.19+c.phase*0.3)+0.20*Math.sin(c.heading)*thrust*0.7;
      c.heading+=Math.sin(time*0.15+c.phase)*dt*0.4;
      if(c.flee>0){vx*=2.2;vz*=2.2;}
      c.vx=lerp(c.vx,vx,dt*1.4);c.vz=lerp(c.vz,vz,dt*1.4);
      c.x+=c.vx*dt;c.z+=c.vz*dt;
      c.y=lerp(c.y,-0.95+0.22*Math.sin(time*0.7+c.phase)-thrust*0.12,dt*1.5);
      c.tilt=lerp(c.tilt,clamp(c.vx*0.18,-0.3,0.3),dt*1.2);
      if(shore<0.03){c.x+=0.9*dt;c.z+=0.9*dt;}
    }
    if(whirlOn&&whirl.str>0.01){
      const dx=whirl.x-c.x,dz=whirl.z-c.z,r=Math.hypot(dx,dz)+0.001;
      if(r<15){
        const f=(1-r/15)*whirl.str;
        c.x+=(-dz/r)*f*dt*(ray?3.2:5.6);
        c.z+=(dx/r)*f*dt*(ray?3.2:5.6);
        if(!ray){c.x+=dx/r*f*dt*2.0;c.z+=dz/r*f*dt*2.0;}
      }
    }
    c.x=clamp(c.x,-W*0.48,W*0.48);c.z=clamp(c.z,-H*0.48,H*0.48);
    c.sub=c.y<0?clamp(-c.y/1.8,0,1):0;
  }
}
function smooth01(x){x=clamp(x,0,1);return x*x*(3-2*x);}

/* ---- upload instance data ---- */
function uploadCreatures(){
  let rn=0,jn=0,sn=0;
  const sh=shadowMat.uniforms.uSh.value;
  for(const c of creatures){
    const uv=worldToUV(c.x,c.z);
    sh[sn++].set(uv[0],uv[1],c.size/W*1.35*(1+c.sub*0.35));
    if(isRay(c.kind)){
      const flap=c.kind<2?(c.rest?0.25:1.0):0.0;
      setN(rayInst.at,'aOffset',rn,c.x,c.y,c.z);
      setN(rayInst.at,'aP0',rn,c.heading,c.size,c.phase,c.bank);
      setN(rayInst.at,'aP1',rn,c.sub,flap,c.kind,c.flip);
      setN(tailInst.at,'aOffset',rn,c.x,c.y,c.z);
      setN(tailInst.at,'aHeading',rn,c.heading);setN(tailInst.at,'aScale',rn,c.size);
      setN(tailInst.at,'aPhase',rn,c.phase);setN(tailInst.at,'aKind',rn,c.kind);
      setN(tailInst.at,'aActive',rn,1);setN(tailInst.at,'aSub',rn,c.sub);
      rn++;
    }else{
      setN(bellInst.at,'aOffset',jn,c.x,c.y,c.z);
      setN(bellInst.at,'aScale',jn,c.size);setN(bellInst.at,'aPhase',jn,c.phase);
      setN(bellInst.at,'aKind',jn,c.kind-3);setN(bellInst.at,'aActive',jn,1);
      setN(bellInst.at,'aSub',jn,c.sub);setN(bellInst.at,'aTilt',jn,c.tilt);
      jellyA[c.slot].set(c.x,c.y,c.z,c.size);
      jellyB[c.slot].set(c.vx,c.vz,c.y>0.4?1:0,c.phase);
      jn++;
    }
  }
  rayInst.geo.instanceCount=rn;tailInst.geo.instanceCount=rn;bellInst.geo.instanceCount=jn;
  flushAttrs(rayInst.at);flushAttrs(tailInst.at);flushAttrs(bellInst.at);
  shadowMat.uniforms.uCount.value=sn;
}

/* ==================== main loop ==================== */
let last=performance.now(),frames=0,fpsT=0,booted=false,shadowTick=0;
let appliedPixel=-1,appliedQuality=-1,goodWindows=0,warmupUntil=0,cooldownUntil=0;
const _projV=new THREE.Vector3();
function applyQuality(){
  pixelRatio=quality===2?DPRMAX:quality===1?Math.min(1.25,DPRMAX):0.8;
  /* skip redundant resize/reallocation when the tier did not actually change */
  if(pixelRatio===appliedPixel&&quality===appliedQuality)return;
  appliedPixel=pixelRatio;appliedQuality=quality;
  fit();pMat.uniforms.uDpr.value=pixelRatio;
  waterUniforms.uQuality.value=quality;
}
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-last)/1000,0.05);last=now;
  time+=dt;
  /* shader compilation and one-off bakes skew the first seconds; ignore them.
     Downshift thresholds are unchanged from the original, so this never lowers
     quality sooner than before - it only stops the up/down thrash. */
  if(!warmupUntil)warmupUntil=now+2500;
  frames++;fpsT+=dt;
  if(fpsT>1.7){
    const fps=frames/fpsT;
    frames=0;fpsT=0;
    if(now>=warmupUntil&&now>=cooldownUntil){
      if(fps<30&&quality>0){quality--;applyQuality();cooldownUntil=now+4000;goodWindows=0;}
      else if(fps<47&&quality>1){quality--;applyQuality();cooldownUntil=now+4000;goodWindows=0;}
      else if(fps>56&&quality<2){
        /* three consecutive good windows before climbing back up: prevents the
           old oscillation that repeatedly rebuilt the drawing buffer */
        if(++goodWindows>=3){quality++;applyQuality();cooldownUntil=now+4000;goodWindows=0;}
      }else goodWindows=0;
    }
  }
  calmV=lerp(calmV,calm?1:0,dt*1.4);
  rainV=lerp(rainV,rainOn?1:0,dt*2.0);
  whirl.str=lerp(whirl.str,whirlOn?1:0,dt*2.2);
  CU.uTime.value=time;
  updateCreatures(dt);
  uploadCreatures();
  updateParticles(dt);
  updateAudio();
  if(rainOn){
    const n=quality<1?1:3;
    for(let i=0;i<n;i++)addPulse(rnd(0.06,0.94),rnd(0.06,0.94),0.006,0.11,false);
  }
  if(whirlOn&&Math.random()<dt*2.0){
    const uv=worldToUV(whirl.x,whirl.z);
    const a=rnd(0,TAU),r=rnd(1,4);
    addPulse(uv[0]+Math.cos(a)*r/W,uv[1]+Math.sin(a)*r/H,0.010,0.16,false);
  }
  flushPulses();
  SIM_STEP.uniforms.uCalm.value=calmV;
  stepSim(quality>1?2:1);
  waterUniforms.uHeight.value=simA.texture;
  waterUniforms.uTime.value=time;
  waterUniforms.uCalm.value=calmV;
  waterUniforms.uRain.value=rainV;
  waterUniforms.uWhirl.value.set(whirl.x/W+0.5,whirl.z/H+0.5,whirl.str);
  shadowMat.uniforms.uTime.value=time;
  shadowTick++;
  if(quality>0||shadowTick%2===0){
    renderer.setRenderTarget(shadowRT);
    renderer.render(shadowScene,shadowCam);
    renderer.setRenderTarget(null);
  }
  if(whirlOn){
    _projV.set(whirl.x,0,whirl.z).project(camera);
    whirlEl.style.left=((_projV.x*0.5+0.5)*window.innerWidth)+'px';
    whirlEl.style.top=((-_projV.y*0.5+0.5)*window.innerHeight)+'px';
  }
  renderer.render(mainScene,camera);
  if(!booted){booted=true;document.getElementById('boot').classList.add('gone');}
}
applyLang();
for(let i=0;i<4;i++)spawn(i%3,{quiet:true});
for(let i=0;i<5;i++)spawn(3+i%2,{quiet:true});
applyQuality();
requestAnimationFrame(animate);
})();
</script>
